<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Squawkbox - Hackable Chat Box</title>
  <style>
    :root {
      --bg-color: #1e1e2e;
      --panel-bg: #282a36;
      --text-color: #f8f8f2;
      --accent-color: #50fa7b;
      --border-color: #44475a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Consolas', 'Courier New', monospace;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    #app {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    #chat-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 2px solid var(--border-color);
    }

    header {
      padding: 12px 20px;
      background-color: var(--panel-bg);
      border-bottom: 2px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 { font-size: 1.1rem; color: var(--accent-color); }

    #message-log {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      background-color: var(--panel-bg);
      padding: 8px 12px;
      border-radius: 4px;
      max-width: 80%;
      word-break: break-word;
    }

    .message .sender {
      font-size: 0.75rem;
      color: var(--accent-color);
      margin-bottom: 4px;
    }

    #chat-controls {
      display: flex;
      padding: 12px;
      background-color: var(--panel-bg);
      border-top: 2px solid var(--border-color);
      gap: 8px;
    }

    input[type="text"], textarea {
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px;
      border-radius: 4px;
      font-family: inherit;
    }

    #username-input { width: 120px; }
    #message-input { flex: 1; }

    button {
      background-color: var(--accent-color);
      color: #111;
      border: none;
      padding: 8px 16px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
    }

    button:hover { opacity: 0.9; }

    #editor-section {
      width: 380px;
      display: flex;
      flex-direction: column;
      background-color: var(--panel-bg);
      transition: width 0.3s ease;
    }

    #editor-section.collapsed {
      width: 0px;
      overflow: hidden;
    }

    .editor-header {
      padding: 12px;
      border-bottom: 2px solid var(--border-color);
      font-weight: bold;
    }

    #code-editor {
      flex: 1;
      width: 100%;
      resize: none;
      border: none;
      padding: 12px;
      outline: none;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .editor-actions {
      padding: 12px;
      border-top: 2px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
    }

    #toggle-editor-btn {
      background-color: var(--panel-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <div id="app">
    <!-- Chat Interface -->
    <div id="chat-section">
      <header>
        <h1>Squawkbox GUI</h1>
        <span
                id="connection-state"
                role="status"
        >
            LINK: CONNECTING
          </span>
        <button id="toggle-editor-btn" onclick="toggleEditor()">Toggle IDE</button>
      </header>

      <div
              id="message-log"
              role="log"
              aria-live="polite"
              aria-label="Chat messages"
      >
        <div class="message">
          <div class="sender">System</div>
          <div>Welcome to Squawkbox! Open the IDE panel to write dynamic scripts.</div>
        </div>
      </div>

      <div id="chat-controls">
        <input
                type="text"
                id="username-input"
                aria-label="Display name"
                placeholder="Name"
                value="Dev1"
        >
        <input
                type="text"
                id="message-input"
                aria-label="Message"
                placeholder="Type a message..."
                onkeydown="
              if (event.key === 'Enter')
              sendMessage()
            "
        >
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>

    <!-- Collapsible Code Editor -->
    <div id="editor-section">
      <div class="editor-header">Live JS Injector</div>
      <textarea id="code-editor" placeholder="// Write custom JS here...&#10;document.body.style.backgroundColor = '#111';"></textarea>
      <div class="editor-actions">
        <button onclick="runCode()">Run / Inject Feature</button>
      </div>
    </div>
  </div>

  <script>
    // --- 1. ADA WEBSOCKET CONNECTION ---
    const protocol =
            window.location.protocol ===
            'https:'
                    ? 'wss:'
                    : 'ws:';

    const host = window.location.host;
    const address =
            `${protocol}//${host}/chat`;

    const chatSocket =
            new WebSocket(address);

    chatSocket.addEventListener(
            'open',
            () => setConnectionState('open')
    );

    chatSocket.addEventListener(
            'close',
            () => setConnectionState('closed')
    );

    chatSocket.addEventListener(
            'error',
            () => setConnectionState('fault')
    );

    chatSocket.addEventListener(
            'message',
            (event) => {
              let message;

              try {
                message =
                        JSON.parse(event.data);
              } catch {
                message = {
                  sender: 'SYSTEM',
                  text: event.data
                };
              }

              renderMessage(message);
            }
    );

    function setConnectionState(state) {
      const isOpen = state === 'open';
      const stateDisplay =
              document.getElementById(
                      'connection-state'
              );
      const messageInput =
              document.getElementById(
                      'message-input'
              );
      const sendButton =
              document.querySelector(
                      '#chat-controls button'
              );

      stateDisplay.textContent =
              `LINK: ${state.toUpperCase()}`;
      messageInput.disabled = !isOpen;
      sendButton.disabled = !isOpen;
      messageInput.placeholder = isOpen
              ? 'Type a message...'
              : 'Link offline';
    }

    function sendMessage() {
      const nameInput =
              document.getElementById(
                      'username-input'
              );
      const messageInput =
              document.getElementById(
                      'message-input'
              );
      const text =
              messageInput.value.trim();
      const user =
              nameInput.value.trim()
              || 'Anonymous';
      const socketIsOpen =
              chatSocket.readyState ===
              WebSocket.OPEN;

      if (!text || !socketIsOpen) return;

      const message = {
        sender: user,
        text: text
      };

      chatSocket.send(
              JSON.stringify(message)
      );

      messageInput.value = '';
      messageInput.focus();
    }

    setConnectionState('connecting');


    function renderMessage(msg) {
      const log = document.getElementById('message-log');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message';
      
      const senderDiv = document.createElement('div');
      senderDiv.className = 'sender';
      senderDiv.textContent = msg.sender;
      
      const textDiv = document.createElement('div');
      textDiv.textContent = msg.text;

      msgDiv.appendChild(senderDiv);
      msgDiv.appendChild(textDiv);
      log.appendChild(msgDiv);
      log.scrollTop = log.scrollHeight;
    }

    // --- 3. IDE & CODE INJECTION LOGIC ---
    function toggleEditor() {
      const panel = document.getElementById('editor-section');
      panel.classList.toggle('collapsed');
    }

    function runCode() {
      const code = document.getElementById('code-editor').value;
      try {
        const result = new Function(code)();
        console.log("Executed successfully:", result);
      } catch (err) {
        alert("Script Error: " + err.message);
      }
    }
  </script>
</body>
</html>
