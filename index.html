<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Squawkbox - Hackable Chat Box</title>
  <style>
    :root {
      --bg-color: #1e1e2e;
      --panel-bg: #282a36;
      --text-color: #f8f8f2;
      --accent-color: #50fa7b;
      --border-color: #44475a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Consolas', 'Courier New', monospace;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    #app {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    #chat-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 2px solid var(--border-color);
    }

    header {
      padding: 12px 20px;
      background-color: var(--panel-bg);
      border-bottom: 2px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 { font-size: 1.1rem; color: var(--accent-color); }

    #message-log {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      background-color: var(--panel-bg);
      padding: 8px 12px;
      border-radius: 4px;
      max-width: 80%;
      word-break: break-word;
    }

    .message .sender {
      font-size: 0.75rem;
      color: var(--accent-color);
      margin-bottom: 4px;
    }

    #chat-controls {
      display: flex;
      padding: 12px;
      background-color: var(--panel-bg);
      border-top: 2px solid var(--border-color);
      gap: 8px;
    }

    input[type=text], textarea {
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px;
      border-radius: 4px;
      font-family: inherit;
    }

    #username-input { width: 120px; }
    #message-input { flex: 1; }

    button {
      background-color: var(--accent-color);
      color: #111;
      border: none;
      padding: 8px 16px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
    }

    button:hover { opacity: 0.9; }

    #editor-section {
      width: 380px;
      display: flex;
      flex-direction: column;
      background-color: var(--panel-bg);
      transition: width 0.3s ease;
    }

    #editor-section.collapsed {
      width: 0px;
      overflow: hidden;
    }

    .editor-header {
      padding: 12px;
      border-bottom: 2px solid var(--border-color);
      font-weight: bold;
    }

    #code-editor {
      flex: 1;
      width: 100%;
      resize: none;
      border: none;
      padding: 12px;
      outline: none;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .editor-actions {
      padding: 12px;
      border-top: 2px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
    }

    #toggle-editor-btn {
      background-color: var(--panel-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <div id="app">
    <!-- Chat Interface -->
    <div id="chat-section">
      <header>
        <h1>Squawkbox GUI</h1>
        <span
                id="connection-state"
                role="status"
        >
            LINK: CONNECTING
          </span>
        <button id="toggle-editor-btn" onclick="toggleEditor()">Toggle IDE</button>
      </header>

<!-- ========================================== -->
<!-- SHARED FILE READER PANEL                   -->
<!-- ========================================== -->
<section id="reader-section" aria-label="Shared Document Reader" style="border: 1px solid #444; margin: 10px 0; padding: 12px; border-radius: 6px; background: #1a1b26; color: #a9b1d6;">
  
  <header style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 10px;">
    <h3 style="margin: 0; font-size: 1.1em; color: #7aa2f7;">📖 Shared File Reader</h3>
    
    <!-- Follow Mode Toggle Switch -->
    <label style="display: flex; align-items: center; gap: 6px; font-size: 0.9em; cursor: pointer;">
      <input type="checkbox" id="follow-toggle">
      <span>Follow Remote Reader</span>
    </label>
  </header>

  <!-- File Selection & Controls -->
  <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap;">
    <input type="file" id="file-input" accept=".txt,.md,.log" aria-label="Select local text file">
    <button id="sample-doc-btn" type="button" style="padding: 4px 8px; cursor: pointer;">Load Sample Doc</button>
  </div>

  <!-- Document Metadata & Status Bar -->
  <div id="doc-metadata" style="font-family: monospace; font-size: 0.85em; background: #16161e; padding: 8px; border-radius: 4px; margin-bottom: 8px;">
    <div><strong>File:</strong> <span id="meta-label">None loaded</span></div>
    <div><strong>Size:</strong> <span id="meta-bytes">0 bytes</span></div>
    <div><strong>SHA-256:</strong> <span id="meta-hash">N/A</span></div>
    <div><strong>Sync Status:</strong> <span id="sync-status" style="font-weight: bold; color: #e0af68;">Disconnected / No Document</span></div>
  </div>

  <!-- Read-Only Document Viewer Area -->
  <pre id="reader-view" tabindex="0" role="region" aria-label="Document Content" style="height: 200px; overflow-y: auto; background: #0f0f14; border: 1px solid #2ac3de; padding: 10px; border-radius: 4px; font-family: monospace; white-space: pre-wrap; margin: 0;">
Select a text file above to view its contents...
  </pre>

</section>

      <div
              id="message-log"
              role="log"
              aria-live="polite"
              aria-label="Chat messages"
      >
        <div class="message">
          <div class="sender">System</div>
          <div>Welcome to Squawkbox! Open the IDE panel to write dynamic scripts.</div>
        </div>
      </div>

      <div id="chat-controls">
        <input
                type="text"
                id="username-input"
                aria-label="Display name"
                placeholder="Name"
                value="Dev1"
        >
        <input
                type="text"
                id="message-input"
                aria-label="Message"
                placeholder="Type a message..."
                onkeydown="
              if (event.key === 'Enter')
              sendMessage()
            "
        >
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>

    <!-- Collapsible Code Editor -->
    <div id="editor-section">
      <div class="editor-header">Live JS Injector</div>
      <textarea id="code-editor" placeholder="// Write custom JS here...&#10;document.body.style.backgroundColor = '#111';"></textarea>
      <div class="editor-actions">
        <button onclick="runCode()">Run / Inject Feature</button>
      </div>
    </div>
  </div>

  <script>
    // --- 1. ADA WEBSOCKET CONNECTION ---
    const protocol =
            window.location.protocol ===
            'https:'
                    ? 'wss:'
                    : 'ws:';

    const host = window.location.host;
    const address =
            `${protocol}//${host}/chat`;

    const chatSocket =
            new WebSocket(address);

    chatSocket.addEventListener(
            'open',
            () => setConnectionState('open')
    );

    chatSocket.addEventListener(
            'close',
            () => setConnectionState('closed')
    );

    chatSocket.addEventListener(
            'error',
            () => setConnectionState('fault')
    );

    chatSocket.addEventListener(
            'message',
            (event) => {
              let message;

              try {
                message =
                        JSON.parse(event.data);
              } catch {
                message = {
                  sender: 'SYSTEM',
                  text: event.data
                };
              }

              renderMessage(message);
            }
    );

    function setConnectionState(state) {
      const isOpen = state === 'open';
      const stateDisplay =
              document.getElementById(
                      'connection-state'
              );
      const messageInput =
              document.getElementById(
                      'message-input'
              );
      const sendButton =
              document.querySelector(
                      '#chat-controls button'
              );

      stateDisplay.textContent =
              `LINK: ${state.toUpperCase()}`;
      messageInput.disabled = !isOpen;
      sendButton.disabled = !isOpen;
      messageInput.placeholder = isOpen
              ? 'Type a message...'
              : 'Link offline';
    }

    function sendMessage() {
      const nameInput =
              document.getElementById(
                      'username-input'
              );
      const messageInput =
              document.getElementById(
                      'message-input'
              );
      const text =
              messageInput.value.trim();
      const user =
              nameInput.value.trim()
              || 'Anonymous';
      const socketIsOpen =
              chatSocket.readyState ===
              WebSocket.OPEN;

      if (!text || !socketIsOpen) return;

      const message = {
        sender: user,
        text: text
      };

      chatSocket.send(
              JSON.stringify(message)
      );

      messageInput.value = '';
      messageInput.focus();
    }

    setConnectionState('connecting');


    function renderMessage(msg) {
      const log = document.getElementById('message-log');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message';
      
      const senderDiv = document.createElement('div');
      senderDiv.className = 'sender';
      senderDiv.textContent = msg.sender;
      
      const textDiv = document.createElement('div');
      textDiv.textContent = msg.text;

      msgDiv.appendChild(senderDiv);
      msgDiv.appendChild(textDiv);
      log.appendChild(msgDiv);
      log.scrollTop = log.scrollHeight;
    }

    // --- 3. IDE & CODE INJECTION LOGIC ---
    function toggleEditor() {
      const panel = document.getElementById('editor-section');
      panel.classList.toggle('collapsed');
    }

    function runCode() {
      const code = document.getElementById('code-editor').value;
      try {
        const result = new Function(code)();
        console.log("Executed successfully:", result);
      } catch (err) {
        alert("Script Error: " + err.message);
      }
    }
  </script>
<script>
  // ==========================================
  // SHARED FILE READER LOGIC (Chunk 2)
  // ==========================================

  const fileInput = document.getElementById('file-input');
  const sampleBtn = document.getElementById('sample-doc-btn');
  const readerView = document.getElementById('reader-view');
  const metaLabel = document.getElementById('meta-label');
  const metaBytes = document.getElementById('meta-bytes');
  const metaHash = document.getElementById('meta-hash');
  const syncStatus = document.getElementById('sync-status');

  // Utility to format byte counts into binary units (KiB, MiB)
  function formatBytes(bytes) {
    if (bytes === 0) return '0 Bytes';
    const k = 1024;
    const sizes = ['Bytes', 'KiB', 'MiB', 'GiB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
  }

  // Calculate SHA-256 hash using the Web Crypto API
  async function computeSHA256(text) {
    const encoder = new TextEncoder();
    const data = encoder.encode(text);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

  // Helper to update UI with document contents and metadata
  async function loadDocumentText(fileName, text) {
    readerView.textContent = text;
    const byteSize = new TextEncoder().encode(text).length;
    const hash = await computeSHA256(text);

    metaLabel.textContent = fileName;
    metaBytes.textContent = `${byteSize.toLocaleString()} bytes (${formatBytes(byteSize)})`;
    metaHash.textContent = hash;
    syncStatus.textContent = "Document Loaded Locally";
    syncStatus.style.color = "#9ece6a"; // Soft green
  }

  // Handle local file upload
  fileInput.addEventListener('change', (event) => {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
      loadDocumentText(file.name, e.target.result);
    };
    reader.readAsText(file);
  });

  // Handle sample document load button
  sampleBtn.addEventListener('click', () => {
    const sampleText = "SQUAWKBOX SHARED DOCUMENT SAMPLE\n" +
                       "---------------------------------\n" +
                       "Line 1: Field inspection report initialized.\n" +
                       "Line 2: Checking signal telemetry across local nodes...\n" +
                       "Line 3: Synchronisation verified.\n" +
                       "Line 4: End of transmission.";
    loadDocumentText("sample_report.txt", sampleText);
  });
// ==========================================
  // WEBSOCKET POSITION DISPATCHER (Chunk 3)
  // ==========================================

  const followToggle = document.getElementById('follow-toggle');
  let localSeq = 0;
  let remoteDocHash = null;

  // Send scroll position when scrolling locally
  readerView.addEventListener('scroll', () => {
    if (!followToggle.checked) return;

    const currentHash = metaHash.textContent;
    if (!currentHash || currentHash === 'N/A') return;

    localSeq++;
    const scrollPercent = readerView.scrollTop / (readerView.scrollHeight - readerView.clientHeight);

    const positionEvent = {
      type: 'reader_position_event_v1', // Experimental protocol ID
      seq: localSeq,
      digest: currentHash,
      bytes: parseInt(metaBytes.textContent),
      scrollPercent: scrollPercent
    };

    // If WebSocket exists and is connected, dispatch position event
    if (window.squawkSocket && window.squawkSocket.readyState === WebSocket.OPEN) {
      window.squawkSocket.send(JSON.stringify(positionEvent));
    }
  });

  // Handle incoming messages from WebSocket
  function handleIncomingNetworkMessage(data) {
    try {
      const msg = JSON.parse(data);

      // Separate Chat Messages from Reader Sync Events
      if (msg.type === 'reader_position_event_v1') {
        handleRemoteReaderEvent(msg);
      } else if (msg.type === 'chat') {
        // Handle regular chat message
        displayChatMessage(msg);
      }
    } catch (e) {
      // Ignore malformed or unparseable messages safely
    }
  }

  // Apply remote scroll position if hashes match and follow mode is enabled
  function handleRemoteReaderEvent(event) {
    const localHash = metaHash.textContent;

    if (localHash !== event.digest) {
      syncStatus.textContent = "Document Revision Mismatch!";
      syncStatus.style.color = "#f7768e"; // Warning Red
      return;
    }

    syncStatus.textContent = "Synced with Remote Reader";
    syncStatus.style.color = "#73daca"; // Soft Teal

    if (followToggle.checked) {
      const targetScroll = event.scrollPercent * (readerView.scrollHeight - readerView.clientHeight);
      readerView.scrollTop = targetScroll;
    }
  }
</script>
</body>
</html>
